# Selfplay config for Influence (see RULES.md).
# One player turn = attack phase + reinforce phase = many micro-moves, every micro-move gets its own search.

useGraphSearch=true
# Only 4 symmetries exist on the hex grid (identity, rotate 180, transpose, anti-transpose)
rootNumSymmetriesToSample=2
stopIfNewNet=false

allowResignation=false
resignThreshold=-0.96
resignConsecTurns = 5

validationProp=0.05

numNNServerThreadsPerModel = 2
gpuToUseThread0 = 0
gpuToUseThread1 = 0

switchNetsMidGame=false

# Tuned on the 2080 Ti VPS (2026-10-11): 768 games / batch 384 / 2 server threads = 36k evals/s (512/256/2: 33k, 128/128/1: 22k).
# Needs COMPILE_MAX_BOARD_LEN 11: with 40, Board/BoardHistory/NNOutput copies were ~9x bigger and 768 games OOMed on 16 GB.
numGameThreads = 512
nnMaxBatchSize = 256

maxVisits = 200

reduceVisits = true
reduceVisitsThreshold = 0.95
reduceVisitsThresholdLookback = 3
reducedVisitsWeight = 0.1
reducedVisitsMin = 20

# ~7.8% of moves get a full (recorded) search: games are ~2k moves, so this shifts compute into more games
cheapSearchProb = 0.85
cheapSearchTargetWeight = 0.0
cheapSearchVisits = 20
# Reinforce stage: one move per reinforcement point, most of them are cheap and not recorded
reinforceCheapSearchProb = 0.95

# Board------------------------------------------------------------------------------------

dataBoardLen = 11
bSizes = 11
bSizeRelProbs = 1
allowRectangleProb = 0.00

# Draw after this many player turns
maxTurns = 180
# Variant rule: pass (ending the attack phase) is illegal while any attack is still legal
forbidPassUnlessNoOtherMove = false
# Probability of random starting cells / strengths instead of the default setup
randomStartProb = 0.1
# Probability of random interior walls, and their max density
randomWallsProb = 0.1
randomWallsMaxDensity = 0.2

# Logs------------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 500
logToStdout = true

# Data writing-----------------------------------------------------------------------------------

maxDataQueueSize = 100000
maxRowsPerTrainFile = 25000
maxRowsPerValFile = 5000
firstFileRandMinProp = 0.15

# Fancy game selfplay settings--------------------------------------------------------------------
initGamesWithPolicy = false
policyInitAreaTemperature=1.5
# In micro-moves
policyInitAvgMoveNum = 10
forkSidePositionProb = 0.040

subtreeValueBiasFactor=0.0

# Moves-left utility (as in lc0): once |root winloss| > movesLeftThreshold, the winning side prefers lines the net
# predicts to end in fewer turns (the losing side, more). Needs a net whose scoremean head has learned moves left
# (data written since the moves-left target was added), so keep it off (slope 0) until then. Starting point
# from lc0's per-ply values: slope 0.003-0.01 utility per turn, max effect ~0.035.
movesLeftSlope = 0.0027
# movesLeftMaxEffect = 0.0345
movesLeftThreshold = 0.9
# movesLeftScaledFactor = 1.6521

# No playout-doubling-advantage input feature in the Influence net
normalAsymmetricPlayoutProb = 0.0
maxAsymmetricRatio = 4.0

policySurpriseDataWeight = 0.5
valueSurpriseDataWeight = 0.1

# Match-----------------------------------------------------------------------------------

# In micro-moves, safety cap only (games end by maxTurns)
maxMovesPerGame = 30000

noResultRandRadius=1.0

# Search limits-----------------------------------------------------------------------------------

numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------

nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 20
nnRandomize = true

# Root move selection and biases------------------------------------------------------------------------------

chosenMoveTemperatureEarly = 0.75
# In micro-moves (Board::movenum), no board-size scaling; turns 1-4 take ~14,20,21,29
chosenMoveTemperatureHalflife = 26
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25

rootDesiredPerChildVisitsCoeff = 2

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------

cpuctExploration = 1.0
cpuctExplorationLog = 0.45
cpuctExplorationBase = 500

rootPruneUselessMoves = false

rootPolicyTemperatureEarly = 1.5
rootPolicyTemperature = 1.1
nnPolicyTemperature = 1.0

allowEarlyDraw = false
earlyDrawThreshold = 0.9
earlyDrawConsecTurns = 99
earlyDrawProbSelfplay = 0.0
